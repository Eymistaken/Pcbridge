# ---------------------------------------------------------------------------
# pcbridge configuration
#
# `pcbridge setup` creates ~/.config/pcbridge/config.toml from this file with a
# fresh password and token. To do it by hand: copy it there and run
#   chmod 600 ~/.config/pcbridge/config.toml
# The file holds secrets; `pcbridge doctor --fix` tightens its mode.
# ---------------------------------------------------------------------------

# Format version of this file. `pcbridge setup` migrates older files and keeps
# a timestamped backup; do not change it by hand.
config_version = 2

# Agent used when a call names neither an agent nor a model of a known agent.
default_agent = "claude"

# The PUBLIC address a tunnel (Tailscale Funnel, Cloudflare Tunnel) gives you,
# WITHOUT a trailing slash. Remote clients get this address plus /mcp.
# Local clients (Claude Code, Codex, Claude Desktop) never use it; for a
# local-only machine "http://localhost:8765" is fine.
public_url = "https://CHANGE-ME.tailXXXX.ts.net"

# Where the server listens locally. The tunnel connects to this port.
host = "127.0.0.1"
port = 8765

# MCP endpoint path (the remote address is public_url + this path).
mcp_path = "/mcp"


[server]
# Send screenshots as image blocks in the tool RESULT as well?
#
#   true    (default) every client gets the image
#   false   no client gets it, only a /shot/<token>.png link or file path
#   "auto"  depends on the transport: ON for local sessions, OFF over HTTP
#
# Why true: every targeted client reads images. Measured (2026-08-03): a
# secret written into a known PNG came back verbatim from Claude Code, and a
# real session calling `screen_capture` described the screen correctly.
#
# "auto" is the fallback for a client that cannot handle image blocks.
#
# Cost of an image (measured, Claude): 1920x1080 ~12976, 1280x720 ~11712
# cache-creation tokens. The text path (`ui_dump`) is still cheaper and
# cannot miss, because it uses no coordinates.
inline_images = true


[auth]
# The password the /authorize consent page asks for. Make it LONG and unique.
# Can also come from the environment: PCBRIDGE_PASSWORD=...
password = "WRITE-A-VERY-LONG-PASSWORD-HERE"

# Optional: a fixed bearer token for curl, tests and trusted local apps.
# Empty = disabled. Example: curl -H "Authorization: Bearer <token>" https://.../mcp
# Environment: PCBRIDGE_STATIC_TOKEN=...
static_token = ""

# Token lifetimes (seconds)
access_token_ttl = 43200      # 12 hours
refresh_token_ttl = 7776000   # 90 days
auth_code_ttl = 300           # 5 minutes

# Failed password attempts from one IP before a lockout
max_failed_attempts = 8
lockout_seconds = 900

# DEBUGGING: when true, the consent page does not redirect automatically after
# the password is accepted; it shows a link instead, so you can see the other
# side's error page. Keep false in normal use.
manual_redirect = false


[paths]
# Directory used when a tool call gives no workdir
default_workdir = "~"
# Job records, logs, the grant state and the OAuth database live here.
# Default: $XDG_STATE_HOME/pcbridge (~/.local/state/pcbridge).
state_dir = "~/.local/state/pcbridge"


[limits]
# Maximum characters returned in one answer
max_output_chars = 12000
# Default timeout of background jobs (seconds)
default_job_timeout = 1800
# Maximum wait for shell_run (synchronous)
max_sync_timeout = 120

# audit.log rolls over to `.1` above this size (bytes). 0 = never.
# The audit log covers the shell, agent and file tools too: what was done is
# recorded, CONTENT is not (the command yes, its output no; the file path yes,
# its content no).
audit_max_bytes = 5000000


# ---------------------------------------------------------------------------
# NATIVE DESKTOP HELPER
#
# pcbridge-native is an optional compiled helper for capture, input and
# accessibility. It is never downloaded or built at run time; the package
# ships it, or `scripts/build-native.sh` builds it in a git checkout.
# ---------------------------------------------------------------------------

[native]
# Who grabs the RAW FRAME of a screenshot. Cropping, scaling, the shot id, the
# record file and every coordinate conversion stay in Python either way --
# only the source of the frame changes.
#
#   "auto"    DEFAULT: the packaged native helper when present, otherwise the
#             Python path. A fallback shows as `degraded` in
#             `system_capabilities` and in the `screen_capture` result. With
#             `[desktop] capture_backend = "gnome-screenshot"` the Python path
#             stays.
#   "python"  the older path: Mutter ScreenCast + GStreamer in
#             `screencast_helper.py`, run by the system python3.
#   "rust"    REQUIRE the native helper. Without it, or when it cannot get a
#             frame, the call FAILS; it never falls back silently.
#
# On KDE Plasma only the native helper can capture (KWin's ScreenShot2, which
# KWin grants to the helper alone); "python" leaves capture unavailable there.
#
# The choice is made ONCE when a runtime starts; the backend never changes in
# the middle of an open session.
#
# Either way, screen sharing starts with `desktop_unlock`: the sharing
# indicator appears with the grant and disappears when it closes
# (`desktop_lock`, expiry). Measurements: docs/native/verification-linux.md.
capture = "auto"

# Which path keyboard, pointer and clipboard take. Default `auto` since Gate 5
# (2026-09-19, 8/8 on a real desktop: 0 px error on two monitors, Turkish text
# exact, held input released 67 ms after a revoke).
#
#   "auto"    DEFAULT: native when the helper is packaged, otherwise Python.
#             The fallback is visible: system_capabilities shows
#             input.keyboard and input.pointer as `degraded` with the reason.
#   "rust"    native required: no helper, no silent fallback, the call fails.
#   "python"  the older path: Python evdev keyboard/pointer and wl-clipboard.
#
# On both paths the order of typing text (save the clipboard -> put the text
# -> Ctrl+V -> restore) is Python's; on the native path wl-paste/wl-copy run
# in the helper.
input = "auto"

# Who reads the accessibility tree (ui_dump, window_list, the focused window)
# and performs ui_click / ui_set_text. The native helper talks to AT-SPI
# directly over D-Bus (no GI, no GTK) and gives the same list and the same
# errors as the Python helper on the same fixture. An action goes to the helper
# that made the dump.
#
#   "auto"    DEFAULT: native when packaged, otherwise Python (visibly:
#             system_capabilities shows accessibility.read as `degraded`). An
#             old helper (built before Task 6.3) fails in ui_dump/ui_click;
#             `pcbridge doctor` says so; rebuild with scripts/build-native.sh.
#   "python"  atspi_helper.py in the system python3.
#   "rust"    native required; no helper means the call fails.
#
# Without a grant (desktop_unlock), screen_info's window list always comes from
# the Python helper: the native helper only runs bound to a grant.
accessibility = "auto"

# Optional absolute path of pcbridge-native. The PCBRIDGE_NATIVE_BIN
# environment variable wins. Empty = the packaged executable.
binary_path = ""


# ---------------------------------------------------------------------------
# DESKTOP CONTROL (keyboard + pointer + screen)
#
# With this section enabled, pcbridge creates a virtual keyboard and pointer
# through /dev/uinput and can really USE the computer. On Wayland there is no
# other way (xdotool only sees XWayland, the portal asks every session).
#
# ENABLE IT KNOWING WHAT IT MEANS: every application in your session, your
# logged-in browser and your password manager come within reach. The agent
# still has to call desktop_unlock (time-limited, visible) before any desktop
# tool works.
#
# One-time prerequisite: /dev/uinput access (`pcbridge doctor` prints the command)
# Diagnosis:             pcbridge doctor
# Emergency stop:        pcbridge lock   (grant closed, screen sharing stopped)
# ---------------------------------------------------------------------------

[desktop]
# OFF BY DEFAULT, so that enabling it is a deliberate act.
enabled = false

# Desktop tools only work after desktop_unlock(minutes); the grant closes by
# itself when the time is up. No minutes given: the first value; the second is
# the ceiling.
unlock_default_minutes = 15
unlock_max_minutes = 120

# SLIDING GRANT: tie the grant to the last ACTION, not to a fixed end. Every
# successful desktop call moves the end to "now + this value"; when the agent
# stops, the grant drops this many seconds later and the screen-edge frame goes
# out.
#
# Why: an agent has no "I am done" event -- it cannot know what happens after
# its last tool call. Forgetting `desktop_lock` is therefore structural, not
# carelessness, and the fix belongs in the code. With a fixed end the grant
# (and the frame) stayed open for minutes.
#
# `unlock_default_minutes` remains the HARD CEILING: the sliding window is a
# softer limit that ends earlier and can never extend the grant beyond it. A
# refused call does not slide it and never revives an expired grant.
#
# The local visual agent (`computer_task`) also has a heartbeat: while the job
# runs the server keeps the grant fresh, because the agent's THINKING time can
# exceed this threshold. The hard ceiling applies there too.
#
# 0 = off (a fixed end). Otherwise at least 10.
unlock_idle_seconds = 90

# Show a desktop notification when `desktop_unlock` runs.
#
# The user must SEE that access is open. A notification is not the only way:
# the GNOME Shell extension shows the same state as a frame around the screens
# and it stays, while a notification disappears after a few seconds. With the
# extension installed the notification is redundant; you may set false.
# Do not turn BOTH off: then the grant is invisible except for GNOME's small
# screen-sharing icon.
#
# On KDE Plasma the notification IS the grant's visible signal: it stays on
# screen while the grant is open, has a "Lock now" button that runs the kill
# switch, and closes when the grant ends. There is no frame and no sharing
# indicator on Plasma, so keep this true there.
unlock_notification = true

# --- starting GUI applications from the shell ------------------------------
# Opt-in rule: when true, while the desktop grant is OPEN, `shell_run` /
# `shell_run_background` refuse to start a NEW GUI process from the list below
# and suggest `window_focus` instead.
#
# Why: an application started from the shell becomes a child of pcbridge and a
# restart of pcbridge closes it (start_new_session separates the session, not
# the cgroup). It also often gets no application id, so `window_list` and
# `window_focus` cannot FIND its window later. `window_focus` goes through the
# desktop's own launcher and has neither problem.
#
# The list is EMPTY by default: NOTHING is blocked. On purpose -- this is the
# only rule with a false-positive risk. Add the names that hurt you:
#
#   gui_launch_blocklist = ["Vesktop", "Text Editor", "code"]
#
# Names are LOOKED UP in the `.desktop` table (data, not guesses): "Text Editor"
# also catches `gnome-text-editor x.md`, because the entry's `Exec=` binary is
# a key too. Flatpak's `flatpak run <id>` form is recognized as well.
#
# Handing a URL to a running browser is different: `google-chrome https://...`
# passes the request to the existing Chrome process, so no window becomes a
# child of pcbridge. Keep this false if you do not want such commands blocked.
#
# While the desktop grant is CLOSED this gate never applies.
block_gui_launch_in_shell = false
gui_launch_blocklist = []

# WRITE actions are refused unless this many seconds passed since the user's
# last keyboard/pointer input: when you are at the machine, remote input and
# your own mouse should not fight. A tool call can pass force = true on
# purpose. 0 = no check.
idle_guard_seconds = 60

# At most this many actions per second, so an agent stuck in a loop cannot
# take over the machine. 0 = unlimited (not recommended).
# For write actions the window is shared ACROSS PROCESSES: the MCP server,
# pcb-do and the single-action tools count under one execution lock.
max_actions_per_second = 10

# Default for calls that give no monitor= and are read per monitor.
# Monitors are numbered by position, left to right, starting at 1 (the
# primary monitor need not be number 1).
default_monitor = 1

# Text is typed through the clipboard + Ctrl+V by default (independent of the
# keyboard layout). true = the clipboard's previous content is restored after
# pasting, so the clipboard is never silently taken.
restore_clipboard = true

# keyboard_layout is no longer used: text is typed through the clipboard, so
# the keyboard layout does not matter. Older files may still set it.

# --- pointer movement ------------------------------------------------------
# The pointer travels through intermediate points instead of JUMPING to the
# target; pixels per second. 0 = jump (the fastest). 5000 -> across one
# 1920-pixel screen in about 0.4 s.
#
# The intermediate points really arrive (measured 2026-08-03): all 48 ABS_X +
# 48 ABS_Y events of a 48-step move were read from the device's event node;
# the kernel merged none.
#
# `drag` does NOT depend on this: even with 0 a drag goes through intermediate
# points, because most applications do not count a single jump as a drag.
pointer_speed = 5000

# One movement takes at most this long (ms); longer distances go faster.
pointer_move_max_ms = 500

# Keys and buttons held with `mouse(action = "hold")` / `keyboard(action =
# "hold")` are released AUTOMATICALLY after this many seconds.
# 0 = never. NOT RECOMMENDED: a forgotten `release` keeps the key down for
# good, the agent does not notice, and the machine becomes unusable.
hold_max_seconds = 120

# How long a click holds the button down (ms). It used to be a fixed 30 ms.
# Applications that poll input at fixed intervals -- games with 50 ms ticks --
# can miss a click whose press and release fall into one interval; 60 ms
# always overlaps at least one 50 ms poll. `mouse` and `computer_batch` can
# override it per call with `hold_ms`. 0-150: in a double/triple click every
# press lasts this long and all presses must fit GNOME's 400 ms threshold.
click_hold_ms = 60

# --- screenshots -----------------------------------------------------------
# screen_capture needs desktop_unlock TOO: it shows whatever is on the screen
# (passwords, messages), which makes it the most privacy-sensitive tool. Only
# the "keyboard used recently" guard does not apply to it -- being at the
# machine should not stop you from looking at your own screen. It is still
# refused while the screen is LOCKED.

# Long edge AFTER cropping. Every monitor is cropped out first and scaled
# after that; scaling a wide canvas as one picture would make button labels
# unreadable. 0 = no scaling (full resolution, large files). Otherwise at
# least 320.
#
# BOTH `screen_capture` AND `pcb-shot` use this value, so the agent sees the
# same pixel space whichever path it took; `pcb-shot --scale` overrides it once.
#
# HARD LIMIT: the Anthropic API scales images whose long edge exceeds 1568
# down BY ITSELF. Going above that is not just a misleading reported scale:
# the server converts coordinates, so the model reports a pixel of the
# downscaled frame, the server applies the recorded scale, and the difference
# (1.22x for 1920) goes SILENTLY into the coordinate. Above 1568,
# `screen_capture` and `pcb-shot` print a warning; such pictures are for
# looking, not for reading coordinates.
#
# A very wide or very tall single monitor (ultrawide, portrait) is scaled by
# its LONG edge too, which can make text small; `screen_capture` then says so
# and suggests `region` to zoom in.
#
# 1536 was chosen by measurement (2026-09-06): at 1280, small diacritics blur
# and words get guessed; at 1536 they read directly. Cost: ~540 tokens per
# picture.
screenshot_scale_long_edge = 1536

# Largest pixel AREA of a scaled picture; 0 = no cap. The long edge alone lets
# a 16:10, 4:3 or square monitor cost more than a 16:9 one, so this keeps
# every shape at the area of a 16:9 picture at 1536 (1536x864 = 1327104).
# Portrait monitors are limited by their height (their long edge). A full-
# resolution capture (`scale=0`, and OCR) is never capped.
#
# When a monitor's small text ends up below half its real size -- the shown
# share times the monitor's UI scale, e.g. a 5120x1440 super-ultrawide or a
# 4K monitor at scale 1 -- `screen_capture` and `pcb-shot` say so and suggest
# `region=`. A 4K monitor at scale 2 keeps 80 % and does not warn.
screenshot_max_pixels = 1327104

# Lifetime of a /shot/<token>.png link (seconds). The link is INDEPENDENT of
# OAuth: anyone with the token can see the picture, so do not share it. It
# works any number of times within its lifetime. At least 10.
shot_ttl_seconds = 300

# PNGs on disk are deleted after this many hours; only disk hygiene.
shot_keep_hours = 24

# Draw the pointer into screenshots. Default true: it is the only way to check
# that the pointer really went where it was sent.
include_pointer = true

# How the screen is captured:
#   "auto"             screen sharing when available, else gnome-screenshot (default)
#   "screencast"       screen sharing only; if it cannot start, NO picture
#   "gnome-screenshot" the old path
#
# Why sharing: `gnome-screenshot` flashes the screen WHITE and plays a sound on
# every capture (it draws the flash itself). The XDG portal does the same.
# GNOME's screenshot D-Bus interface cannot be called from outside ("Access
# denied", GNOME 46). The screen SHARING path has no flash: the system treats
# it as video, not a photo. Measured 2026-08-03, no loss either: the same
# region is 99.8% identical in both.
#
# Sharing starts with `desktop_unlock` and stops with `desktop_lock` or expiry.
# While it runs the panel shows a sharing indicator -- WANTED: it tells you the
# agent can reach the desktop right now. The indicator is visible in captured
# frames too.
#
# Needs python3-gi, gstreamer1.0-pipewire and gstreamer1.0-plugins-good for the
# Python path; otherwise it falls back to gnome-screenshot.
#
# GNOME only. On KDE Plasma keep "auto": capture there works only through the
# native helper, and KWin's screenshots show no indicator (see
# `unlock_notification`).
capture_backend = "auto"

# `find_text` / `wait_for_text` read on-screen text with tesseract. Languages
# joined with `+`; every language is a separate package. Tesseract is NOT
# installed by default and installing it needs sudo:
#   sudo apt install tesseract-ocr            (English data included)
#   sudo apt install tesseract-ocr-deu        (another language, e.g. German)
# When missing, both tools say so with the install command; nothing else is
# affected.
ocr_languages = "eng"

# At most this many actions in one computer_batch call. Splitting a list is
# always possible; the limit guards against an agent stuck in a loop.
batch_max_actions = 40

# Time budget of one batch (seconds).
#
# A list whose ESTIMATED time exceeds the budget NEVER STARTS: it is refused
# before a single action is sent. A started list does not begin the next action
# once the budget is used up (no half click) and returns the actions not done.
#
# Why 50: most clients give up on a tool call after 60 seconds. Measured
# 2026-09-21: a list of four `wait 30000` ran 60 seconds under the old 90 s
# budget, and the client had already dropped the answer with "did not respond
# within 60s" -- the agent never learned what was done. The 10 seconds left are
# for the final `ui_dump`/`screen_capture` and the answer. With clients that
# wait longer (Claude Code), up to 105 is possible (an MCP call cannot exceed
# 110 s).
batch_budget_seconds = 50

# Check after every click whether the focus changed.
# Measured 2026-08-02: a blind click moved the focus to another window and the
# following keys went there -- during development a measuring click landed on
# the desktop and the `ctrl+a` + `Delete` that followed trashed 23 items. With
# this on, the batch stops at that point. Keep it on.
batch_check_focus = true

# --- local visual agent (computer_task) ------------------------------------
# computer_task hands visual work to an agent ON THIS MACHINE: it captures the
# screen with `pcb-shot`, reads the PNG itself, clicks with `pcb-do`, looks
# again.
#
# Clients that see images (Claude Code, Codex) can do the work themselves with
# `screen_capture` + `computer_batch`. computer_task exists to push a LONG GUI
# task into the background so the calling agent is not blocked, and for
# applications whose accessibility tree comes back EMPTY (measured: Vesktop's
# ui_dump has 0 nodes).

# Which agent drives it.
#
# The cost: the long GUI loop uses that agent's own quota.
computer_task_agent = "claude"

# Model + effort. EMPTY = the chosen agent's own default -- for claude that is
# `sonnet` + effort `medium`, a deliberate choice for visual work: the
# look-act loop runs many rounds and opus is expensive on every round.
#
# ⚠️ THESE THREE BELONG TOGETHER. The model must come from the chosen agent's
# list. A mismatch is caught AT STARTUP and the service does not start.
computer_task_model  = ""
computer_task_effort = ""

# Look-act rounds budgeted for the agent. It CANNOT be enforced from outside:
# it is written into the prompt as a budget, backed by the job's timeout and
# pcb-do's rate limit. The tool description does not present it as a
# guarantee.
computer_task_max_steps = 25

# Directory pcb-shot writes PNGs to. Empty = $XDG_RUNTIME_DIR/pcbridge/shots
# (mode 700, tmpfs, removed at logout), or /tmp/pcb if that does not exist.
# Not /tmp by default on purpose: screenshots are the most privacy-sensitive
# output of this project.
agent_shot_dir = ""

# When a coordinate arrives WITHOUT `shot`: if a recent scaled-down capture
# exists and the coordinate falls inside its box, REFUSE the call.
#
# Why: without `shot` the coordinate counts as global and the action silently
# lands in the wrong place -- (640, 360) read off a 1280-wide picture points at
# the middle of the LEFT screen, not a button on the right one. The ambiguity
# cannot be resolved ((640, 360) is a valid global coordinate too), so instead
# of guessing, pcbridge asks: `shot=` or `monitor=`?
#
# False positives are possible: a call that really means a global coordinate
# loses one round and retries with `monitor=`. A good trade against silent
# misclicks -- 23 desktop items were lost exactly this way on 2026-08-02.
# The age limit comes from `agent_shot_max_age_seconds` below.
ambiguous_coord_guard = true

# A sequence STOPS at this many consecutive clicks on the same target. Two go
# through, the third is never sent.
#
# Why: an agent stuck in a loop keeps pressing the same button. The rate limit
# SLOWS it but does not STOP it. If the first two clicks did not have the
# expected effect, a third will not either; the right move is to read the
# screen again with `ui_dump` or `screen_capture`.
#
# "Same target" = the same node id (`ui_click`) or the same coordinate in the
# same space (`monitor`/`shot`). An action such as `move` or `type` in between
# breaks the series; `wait` does NOT, because "click-wait-click" is exactly
# the pattern.
#
# `double_click` / `triple_click` are single actions and do not fill it.
# 0 = off. The smallest valid value is 2.
repeat_click_limit = 3

# When pcb-do sends a COORDINATE action, the newest screenshot may be at most
# this many seconds old. 0 = no check.
#
# Different from batch_check_focus, which asks "did the focus change AFTER the
# click". This one is about a stale picture: if the user switched windows
# after the picture was taken, the focus is already there, the click lands
# there, and because nothing CHANGES the focus guard never fires.
#
# Measured 2026-08-03: a click based on a 69-second-old picture landed on the
# Claude app where Vesktop was expected; no guard fired.
agent_shot_max_age_seconds = 60


# ---------------------------------------------------------------------------
# AGENTS
# {prompt} and {session_id} are template placeholders.
# `command` is a list; its first element is the executable (a name found on
#          PATH or in the usual per-user bin directories, or an absolute path).
# `parser` = "claude_stream_json" | "agy_json" | "plain"
# `pty`    = run the command in a pseudo-terminal (for CLIs that print nothing
#            without a TTY)
#
# MODEL / EFFORT SELECTION
# All fields below are optional. Without them the agent runs as the CLI is
# configured: no model/effort flag is added. Why it matters: Claude Code takes
# its model from ~/.claude/settings.json, so changing /model in an interactive
# session would otherwise silently change the model of remote jobs too.
#
#   model_args    syntax of the model flag, e.g. ["--model", "{model}"]
#   effort_args   syntax of the effort flag, e.g. ["--effort", "{effort}"]
#   models        models that can be chosen freely
#   restricted_models  only chosen when the user names them EXPLICITLY; a
#                 default can never land here
#   blocked_models     can never be chosen
#   efforts       effort levels the agent accepts (general)
#   model_efforts per-model allowed efforts; overrides `efforts`. An EMPTY list
#                 means the model does not accept --effort: no flag is added.
#   default_model      used when no model is given
#   default_effort     used when no effort is given (after model_effort)
#   model_effort  per-model default effort
#   effort_required_with_model  an effort is required whenever a model is given
#   aliases       free text -> canonical name, for models and efforts alike.
#                 Matching is normalized first: lower case, dots, dashes and
#                 underscores count as separators, letter-digit borders split.
#                 So "Gemini 3.6 Flash" = "gemini-3.6-flash" = "gemini 3 6 flash"
#                 and "opus5" = "opus 5". Aliases are only for really different
#                 names.
# ---------------------------------------------------------------------------

[agents.claude]
enabled = true
description = "Claude Code - Anthropic's terminal coding agent"
command = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json",
  "--verbose",
  "--dangerously-skip-permissions",
]
# Arguments ADDED to the command to resume an earlier session
resume_args = ["--resume", "{session_id}"]
parser = "claude_stream_json"
pty = false

model_args  = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]
# Default Sonnet + medium, so that small remote requests do not run on the
# most expensive model and effort.
default_model = "sonnet"
models  = ["sonnet", "opus", "haiku"]
# Fable needs extra usage credit on the Pro plan, and the "best" alias
# resolves to Fable, so both are blocked.
blocked_models = ["fable", "best"]
efforts = ["low", "medium", "high", "xhigh", "max"]
# Given a model alone, Claude Code uses its own default effort without an
# error, so an effort is not required.
effort_required_with_model = false

[agents.claude.model_effort]
sonnet = "medium"
opus   = "high"
haiku  = "medium"

[agents.claude.aliases]
"sonnet 5"  = "sonnet"
"opus 5"    = "opus"
"haiku 4.5" = "haiku"
# Variants of a blocked model map to it too, so they are refused as "blocked"
# instead of "unknown model".
"fable 5"   = "fable"
# Effort aliases in Turkish (input only; the agent sees the canonical name).
"dusuk"      = "low"
"orta"       = "medium"
"yuksek"     = "high"
"extra"      = "xhigh"
"ekstra"     = "xhigh"
"cok yuksek" = "xhigh"
"maksimum"   = "max"
"en yuksek"  = "max"

[agents.antigravity]
# The Antigravity CLI's executable is `agy` (package antigravity-cli).
#
# pty = false: agy 1.1.9 fixed upstream #76 (no output without a TTY).
# Measured: `-p` output goes to a pipe or a file fine; no `script` wrapper.
#
# --output-format json: agy prints structured output (conversation_id, status,
# response, usage), which `parser = "agy_json"` reads -- far sturdier than
# hunting ids in plain text.
enabled = true
description = "Antigravity CLI (agy) - Google's terminal coding agent"
#
# --print-timeout: agy's print mode defaults to 5 MINUTES and then throws the
# work away with `status: ERROR, error: timeout waiting for response`.
# Measured 2026-08-03: a computer_task GUI task hit that wall at 239 s while
# doing nothing wrong -- GUI work is simply slow. 30 minutes matches
# `default_job_timeout`, which stays the real ceiling.
command = [
  "agy", "-p", "{prompt}",
  "--dangerously-skip-permissions",
  "--output-format", "json",
  "--print-timeout", "30m",
]
# To continue a conversation; the id is the conversation_id of the JSON output.
resume_args = ["--conversation", "{session_id}"]
parser = "agy_json"
pty = false

model_args  = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]
# In agy the effort is PART of the model id: `--model X --effort Y` = `X-Y`.
# Gemini models exit 1 without an effort, so it is required.
effort_required_with_model = true
default_model  = "gemini-3.8-flash"
default_effort = "high"
efforts = ["low", "medium", "high"]
models  = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.1-pro"]
# Only when asked for EXPLICITLY; never picked by default.
# The ids are copied from `agy models` -- dashes, not dots.
restricted_models = [
  "claude-sonnet-4-6",
  "claude-opus-4-6-thinking",
  "gpt-oss-120b-medium",
]

# Per-model allowed efforts, derived from `agy models`: gemini-3.1-pro has NO
# medium, and the Claude/GPT-OSS models do NOT accept --effort ("Error:
# invalid model selection" + exit 1).
[agents.antigravity.model_efforts]
"gemini-3.8-flash"         = ["low", "medium", "high"]
"gemini-3.7-flash"         = ["low", "medium", "high"]
"gemini-3.6-flash"         = ["low", "medium", "high"]
"gemini-3.1-pro"           = ["low", "high"]
"claude-sonnet-4-6"        = []
"claude-opus-4-6-thinking" = []
"gpt-oss-120b-medium"      = []

[agents.antigravity.model_effort]
"gemini-3.8-flash" = "high"
"gemini-3.7-flash" = "high"
"gemini-3.6-flash" = "high"
"gemini-3.1-pro"   = "high"

[agents.antigravity.aliases]
"3.6 flash"         = "gemini-3.6-flash"
"flash"             = "gemini-3.6-flash"
"3.5 flash"         = "gemini-3.5-flash"
"3.1 pro"           = "gemini-3.1-pro"
"pro"               = "gemini-3.1-pro"
"gemini pro"        = "gemini-3.1-pro"
"claude sonnet 4.6" = "claude-sonnet-4-6"
"claude opus 4.6"   = "claude-opus-4-6-thinking"
"gpt"               = "gpt-oss-120b-medium"
"gpt oss"           = "gpt-oss-120b-medium"
"gpt oss 120b"      = "gpt-oss-120b-medium"
"dusuk"  = "low"
"orta"   = "medium"
"yuksek" = "high"

# More agents can be added, for example:
# [agents.codex]
# enabled = true
# description = "OpenAI Codex CLI"
# command = ["codex", "exec", "{prompt}"]
# resume_args = []
# parser = "plain"
# pty = false


# ---------------------------------------------------------------------------
# [tools] -- which tools this server offers
# ---------------------------------------------------------------------------
# "full"     every tool (default; the same set as pcbridge 1.x)
# "core"     no desktop tools: agents, jobs, shell, files, tmux, status
# "desktop"  the desktop tools plus job and status tools
# A smaller set saves the client's context. Read at startup only: clients
# cache the tool list, so restart pcbridge and the client after a change.
[tools]
profile = "full"
