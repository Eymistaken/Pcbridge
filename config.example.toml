# ---------------------------------------------------------------------------
# pcbridge yapilandirmasi
# Bu dosyayi "config.toml" olarak kopyalayip duzenleyin, sonra: chmod 600 config.toml
# ---------------------------------------------------------------------------

# Tailscale Funnel / Cloudflare Tunnel'in verdigi DIS adres.
# Sonunda / OLMAYACAK. Uzak istemciye bu adresin sonuna /mcp ekleyerek verilir.
# YEREL istemciler (stdio) bu adresi HIC kullanmiyor -- onlar icin gereksiz.
public_url = "https://DEGISTIR.tailXXXX.ts.net"

# Sunucunun yerelde dinledigi adres. Tunel bu porta baglanir.
host = "127.0.0.1"
port = 8765

# MCP endpoint yolu (uzak istemciye girecegin adres: public_url + bu yol)
mcp_path = "/mcp"


[server]
# Ekran goruntusu arac SONUCUNDA goruntu blogu olarak da gonderilsin mi?
#
#   true    (varsayilan) her istemciye goruntu gider
#   false   hicbir istemciye gitmez, yalnizca /shot/<token>.png baglantisi
#   "auto"  tasimaya bakar: stdio'da ACIK, HTTP'de KAPALI
#
# Varsayilan neden true: hedeflenen butun istemciler goruntuyu okuyabiliyor.
# OLCULDU (2026-08-03): bilinen icerikli bir PNG'ye yazilan gizli deger Claude
# Code'dan birebir geri geldi; uctan uca `screen_capture` cagiran gercek bir
# oturum ekrani dogru tarif etti.
#
# "auto" GERI DONUS YOLU. Gemini Spark cagindan kalma: oraya giden
# function-response kanali yalnizca METIN tasiyor ve goruntu blogu gelince
# BOZULUYOR. Spark artik hedef degil, ama goruntu isleyemeyen baska bir
# istemciyle karsilasirsan "auto" (ya da false) yine ise yarar.
#
# Goruntunun maliyeti (olculdu, Claude): 1920x1080 ~12976, 1280x720 ~11712
# cache_creation jeton. `agy`'de olculen ~40 bin BURADA GECERLI DEGIL.
# Yine de metin yolu (`ui_dump`) hala hem daha ucuz hem ISKALAMIYOR --
# koordinat kullanmadigi icin.
inline_images = true


[auth]
# /authorize sayfasinda soracagi parola. UZUN ve SIZE OZEL olsun.
# Ortam degiskeni ile de verilebilir: PCBRIDGE_PASSWORD=...
password = "BURAYA-COK-UZUN-BIR-PAROLA-YAZ"

# Opsiyonel: curl/test icin sabit bearer token. Bos birakilirsa devre disi.
# Ornek kullanim: curl -H "Authorization: Bearer <token>" https://.../mcp
# Ortam degiskeni: PCBRIDGE_STATIC_TOKEN=...
static_token = ""

# Token omurleri (saniye)
access_token_ttl = 43200      # 12 saat
refresh_token_ttl = 7776000   # 90 gun
auth_code_ttl = 300           # 5 dakika

# Ayni IP'den art arda yanlis parola denemesi limiti
max_failed_attempts = 8
lockout_seconds = 900

# HATA AYIKLAMA: true yapilirsa parola dogrulandiktan sonra otomatik
# yonlendirme yapilmaz, tiklanabilir bir baglanti gosterilir. Karsi tarafin
# (Gemini'nin) hata sayfasini gorebilmek icin. Normal kullanimda false olmali.
manual_redirect = false


[paths]
# Arac cagrilarinda workdir verilmezse kullanilacak dizin
default_workdir = "~"
# Job kayitlari, loglar ve oauth veritabani buraya yazilir
state_dir = "~/.local/state/pcbridge"


[limits]
# Tek bir cevapta don(dur)ulacak maksimum karakter (telefonda okunabilirlik icin)
max_output_chars = 12000
# Arka plan islerinin varsayilan zaman asimi (saniye)
default_job_timeout = 1800
# shell_run (senkron) icin maksimum bekleme
max_sync_timeout = 120

# audit.log bu boyutu (bayt) asinca `.1` olarak devredilir. 0 = donderme yok.
# Denetim kaydi yalnizca masaustu araclarini degil, kabuk/ajan/dosya araclarini
# da iceriyor: ne yapildigi yazilir, ICERIK yazilmaz (komut evet ciktisi hayir,
# dosya yolu evet icerigi hayir).
audit_max_bytes = 5000000


# Ajan adi verilmedigi ve model hicbir ajana ait olmadigi durumda kullanilir.
default_agent = "claude"


# ---------------------------------------------------------------------------
# YEREL MASAUSTU YARDIMCI SURECI
#
# Rust yakalama esligi ve yayina alma kapilari gecilene kadar Python
# varsayilan olarak kalir. Yardimci surec calisma aninda indirilmez veya
# derlenmez.
# ---------------------------------------------------------------------------

[native]
# Ekran goruntusunun HAM KARESINI kimin aldigi. Kirpma, olcekleme, cekim
# kimligi, kayit dosyasi ve butun koordinat donusumu her halukarda Python'da
# kalir -- yalnizca karenin geldigi yer degisir.
#
#   "auto"    VARSAYILAN (Task 4.3'ten beri): paketlenmis yerel yardimci
#             varsa o, yoksa Python yolu. Geri donus `system_capabilities`
#             ciktisinda `degraded` olarak ve `screen_capture` sonucunda
#             acikca yazar. `[desktop] capture_backend = "gnome-screenshot"`
#             secilmisse Python yolu kalir.
#   "python"  eski yol: Mutter ScreenCast + GStreamer, sistem python3'unde
#             yasayan `screencast_helper.py` sureci. Geri almak icin bunu yazin.
#   "rust"    yerel yardimciyi ZORUNLU tut. Yardimci yoksa ya da kare
#             alamazsa cagri HATA verir; sessizce Python yoluna DONMEZ --
#             zorunlu tutmanin amaci tam olarak bunu gormek.
#
# Secim bir runtime kurulurken BIR KEZ yapilir; acik bir oturumun ortasinda
# backend degismez (bir `all` cekimi iki farkli kaynaktan birlestirilmez).
#
# Iki yolda da ekran paylasimi `desktop_unlock` ile acilir: ust cubuktaki
# paylasim gostergesi izinle birlikte belirir ve izin kapaninca (`desktop_lock`,
# sure dolumu) kaybolur. Olcum ve parite: docs/native/verification-linux.md.
capture = "auto"

# Klavye, fare ve pano hangi yoldan gitsin. Gate 5 gectikten sonra
# (2026-09-19, gercek masaustunde 8/8: iki monitorde 0 px sapma, Turkce metin
# birebir, basili girdi revoke'ta 67 ms'de birakildi) varsayilan `auto`.
#
#   "auto"    VARSAYILAN: paketlenmis yardimci varsa native, yoksa Python yolu.
#             Geri dusus gizlenmez: system_capabilities input.keyboard ve
#             input.pointer'i `degraded` + gerekceyle gosterir.
#   "rust"    native zorunlu: yardimci yoksa sessiz fallback yok, cagri hata
#             verir.
#   "python"  eski yol: Python evdev klavye/fare ve wl-clipboard. Geri almak
#             icin bu satiri yazip pcbridge'i yeniden baslatmak yeter.
#
# Her iki yolda da metin yazmanin sirasi (panoyu yedekle -> metni koy ->
# Ctrl+V -> geri yukle) Python'da; native yolda wl-paste/wl-copy yardimcida
# calisir.
input = "auto"

# Erisilebilirlik agacini (ui_dump, window_list, odaktaki pencere) kim okusun
# ve ui_click / ui_set_text'i kim yapsin. Native yardimci ikisini de yapiyor
# (Task 6.2, 6.3): GI ve GTK yok, AT-SPI'a dogrudan D-Bus ile gider; ayni
# fixture'da Python yardimcisiyla ayni listeyi, ayni hatalari veriyor. Eylem,
# dokumu yapan yardimciya gider.
#
#   "auto"    VARSAYILAN (Task 6.3'ten beri): paketlenmis yardimci varsa
#             native, yoksa Python yolu (gorunur sekilde: system_capabilities
#             accessibility.read'i `degraded` gosterir). Eski bir yardimci
#             (Task 6.3 oncesi derleme) ui_dump/ui_click'te hata verir;
#             doctor.sh bunu soyler, scripts/build-native.sh ile yeniden
#             derleyin.
#   "python"  sistem python3'unde calisan atspi_helper.py (eski yol; geri
#             almak icin).
#   "rust"    native zorunlu; yardimci yoksa cagri hata verir.
#
# Izin (desktop_unlock) yokken screen_info'nun pencere listesi her durumda
# Python yardimcisindan okunur: native yardimci yalnizca bir izne bagli calisir.
accessibility = "auto"

# pcbridge-native icin istege bagli mutlak yol. PCBRIDGE_NATIVE_BIN ortam
# degiskeni onceliklidir. Bos deger paketlenmis executable yolunu kullanir.
binary_path = ""


# ---------------------------------------------------------------------------
# MASAUSTU KONTROLU (klavye + fare)
#
# Bu bolum acildiginda pcbridge, /dev/uinput uzerinden sanal bir klavye ve fare
# yaratip bilgisayari fiilen KULLANABILIR hale gelir. Wayland'de baska yolu yok
# (xdotool yalnizca XWayland'i gorur, portal her oturumda onay ister).
#
# NE DEMEK OLDUGUNU BILEREK ACIN: acik oturumunuzdaki her uygulama, oturum
# acilmis tarayiciniz ve parola yoneticiniz erisime girer. Telefonunuzu
# kaybederseniz ne olacagi sorusuna cevabiniz olmali.
#
# Onkosul (bir kez):  sudo ./setup_uinput.sh
# Tani:               ./doctor.sh   (8. baslik)
# Acil durdurma:      systemctl --user stop pcbridge
# ---------------------------------------------------------------------------

[desktop]
# VARSAYILAN KAPALI. Acmak bilincli bir islem olsun diye.
enabled = false

# GUI araclari yalnizca desktop_unlock(dakika) sonrasi calisir ve sure dolunca
# izin kendiliginden kapanir. Dakika verilmezse ilk deger, tavan ikinci deger.
unlock_default_minutes = 15
unlock_max_minutes = 120

# KAYAN KIRA: izin son TARIHE degil son EYLEME bagli olsun. Basarili her
# masaustu cagrisi izni "simdi + bu deger"e ceker; ajan durunca izin bu kadar
# saniye sonra kendiliginden duser ve ekran kenarindaki cerceve soner.
#
# NEDEN: ajanin "isim bitti" diye bir olayi YOK -- son arac cagrisindan sonra
# ne oldugunu bilmiyor. Bu yuzden `desktop_lock`u unutmasi dikkatsizlik degil
# YAPISAL, ve cozumun ajanda degil kodda olmasi gerekiyor. Sabit son tarihte
# izin (ve cerceve) dakikalarca acik kaliyordu.
#
# `unlock_default_minutes` SERT TAVAN olarak durmaya devam ediyor: kayan kira
# ondan once devreye giren yumusak sinir, izni asla onun otesine uzatamaz.
# Reddedilen bir cagri damgalamaz; suresi dolmus bir izni de diriltmez.
#
# Yerel gorsel ajan (`computer_task`) icin ayrica bir kalp atisi var: is
# kostugu surece sunucu izni tazeliyor, cunku ajanin DUSUNME suresi bu
# esikten uzun olabilir. Sert tavan orada da gecerli.
#
# 0 = kapali (eski davranis: sabit son tarih). 0 disinda en az 10.
unlock_idle_seconds = 90

# `desktop_unlock` calisinca masaustune bir bildirim dusurulsun mu.
#
# Iznin acildiginin KULLANICIYA gorunmesi onemli -- ajanin klavye/fareye
# eristigini fark etmediginiz bir an olmamali. Ama bunun tek yolu bildirim
# degil: `gnome-extension/` altindaki GNOME kabuk eklentisi ayni durumu
# ekran kenarlarindaki cerceveyle gosteriyor ve o SUREKLI duruyor, bildirim
# ise birkac saniyede kayboluyor.
#
# Eklenti kuruluysa bildirim gereksiz tekrar olur; false yapabilirsiniz.
# IKISINI BIRDEN kapatmayin: o zaman izin gorunmez olur ve geriye yalnizca
# GNOME'un ust cubuktaki kucuk paylasim simgesi kalir.
unlock_notification = true

# --- kabuktan GUI uygulamasi baslatma ---------------------------------------
# Bu opt-in kural true yapilirsa, masaustu izni ACIKKEN `shell_run` /
# `shell_run_background` asagidaki listedeki YENI bir GUI sureci baslatmaya
# calisinca reddedilir ve `window_focus` onerilir.
#
# NEDEN: kabuktan YENI acilan uygulama pcbridge'in COCUGU oluyor ve
# `systemctl --user restart pcbridge` onu kapatiyor (start_new_session oturum
# grubunu ayiriyor ama cgroup'u degil). Ayrica cogu zaman uygulama kimligi
# olusmuyor, yani `window_list` ve `window_focus` pencereyi sonradan
# BULAMIYOR -- ajan kendi actigi pencereyi kaybediyor. `window_focus`
# masaustunun kendi aramasindan gectigi icin ikisi de olmuyor.
#
# LISTE BOS: varsayilan olarak HICBIR SEY ENGELLENMEZ. Bilincli, cunku yanlis
# pozitif riski tasiyan tek kural bu. Sürtünme yaratan adi siz ekleyin:
#
#   gui_launch_blocklist = ["Vesktop", "Text Editor", "code"]
#
# Adlar `.desktop` tablosunda ARANIYOR (tahmin degil veri): "Text Editor"
# yazmak `gnome-text-editor x.md` komutunu da yakalar, cunku girdinin
# `Exec=` ikilisi de anahtar oluyor. Flatpak uygulamalarinda
# `flatpak run <kimlik>` bicimi de taniniyor.
#
# Calisan bir tarayiciya URL vermek farklidir: `google-chrome https://...`
# mevcut Chrome surecine bir istek devrederse pencere pcbridge'in cocugu olmaz.
# Deterministik URL acma gibi komutlari engellemek istemiyorsaniz bu ayari
# false birakin.
#
# Masaustu izni KAPALIYKEN bu kapi hic devreye girmez: masaustu kapaliyken
# kabuk normal kabuktur.
block_gui_launch_in_shell = false
gui_launch_blocklist = []

# Kullanicinin son klavye/fare hareketinden bu kadar saniye gecmediyse YAZMA
# eylemleri reddedilir: makinenin basindaysaniz telefondan gelen fare ile
# sizinki kavga etmesin. Arac cagrisinda force = true ile bilincli olarak
# gecilebilir. 0 = bu kontrol kapali.
idle_guard_seconds = 60

# Saniyede en fazla kac eylem gonderilebilir. Sonsuz donguye giren bir ajan
# makineyi kilitleyemesin diye. 0 = sinirsiz (onerilmez).
# Yazma eylemleri icin pencere SURECLER ARASI paylasilir: MCP sunucusu, pcb-do
# ve tek eylemli araclar ayni yurutme kilidi altinda sayilir; biri bitip digeri
# hemen baslayinca siniri ikinci kez harcayamaz.
max_actions_per_second = 10

# monitor= verilmeyen ve monitore ozel yorumlanan cagrilar icin varsayilan.
# Numaralandirma SOLDAN SAGA, 1'den baslar (birincil monitor sagda olabilir).
default_monitor = 1

# Metin girisinin varsayilan yolu pano + Ctrl+V (klavye duzeninden bagimsiz
# oldugu icin). true ise yapistirmadan sonra panonun eski icerigi geri yuklenir
# — sessizce pano calmamak icin.
restore_clipboard = true

# YALNIZCA BILGI: ham tus yolunun (keyboard(..., raw = true)) hangi duzende
# yorumlanacagini soyler, girdiyi degistirmez. uinput ham keycode gonderir;
# ekrana ne dusecegini sistemin XKB duzeni belirler. Turkce duzende ham yol
# isaretleri bozar (`@` yerine `"`), bu yuzden varsayilan yol PANO.
keyboard_layout = "tr+intl"

# --- fare hareketi ---------------------------------------------------------
# Imlec hedefe ISINLANMAK yerine ara noktalardan gecerek gider; piksel/saniye.
# 0 = isinla (eski davranis, en hizlisi). 5000 -> ekranin bir ucundan digerine
# (1920 piksel) yaklasik 0,4 saniye.
#
# Ara noktalarin fiilen gittigi OLCULDU (2026-08-03): 48 adimlik bir hareketin
# 48 ABS_X + 48 ABS_Y olayinin tamami cihazin event node'undan okundu, kernel
# hicbirini birlestirmedi.
#
# `drag` bu ayardan BAGIMSIZ: 0 verilse bile sürükleme ara noktalardan gecer,
# cunku tek sicrayista birakilan hareketi cogu uygulama surukleme saymiyor.
pointer_speed = 5000

# Tek bir hareket en fazla bu kadar surer (ms). Cok uzun mesafede hizi artirir;
# tuvalin kosegeni (~3900 px) bu tavana takilir.
pointer_move_max_ms = 500

# `mouse(action = "hold")` / `keyboard(action = "hold")` ile basili birakilan
# tus ve dugmeler bu sureden sonra KENDILIGINDEN birakilir (saniye).
# 0 = otomatik birakma yok. ONERILMEZ: `release` unutulursa tus sonsuza kadar
# basili kalir, ajan bunu fark etmez ve makine kullanilamaz hale gelir.
hold_max_seconds = 120

# --- ekran goruntusu -------------------------------------------------------
# screen_capture DE desktop_unlock ister: ekranda ne varsa (parolalar,
# mesajlar) hepsini gosterdigi icin en gizlilik-hassas arac. Yalnizca "yakinda
# klavye kullanildi" korumasi ona uygulanmaz -- makinenin basinda olmaniz
# ekraniniza bakmanizi engellememeli. Ekran KILITLIYSE yine reddedilir.

# Kirpma SONRASI uzun kenar. Tuval 3840x1080; tek parca 1280'e indirilse her
# monitor ~640x180 kalir ve buton yazilari okunmaz olur. Bu yuzden once monitor
# basina kirpilir, olcekleme ondan sonra yapilir. 0 = hic olcekleme (tam
# cozunurluk, buyuk dosya). 0 disinda en az 320.
#
# HEM `screen_capture` HEM `pcb-shot` bu ayari kullanir. Ayri varsayilanlari
# olsaydi ajanin gordugu cozunurluk hangi yoldan bagli oldugna gore degisirdi
# (ayni ekran, iki farkli piksel uzayi); `pcb-shot --scale` ile tek seferlik
# baskalastirilabilir.
#
# ONEMLI SINIR: Anthropic API uzun kenari 1568'i asan goruntuleri KENDISI
# kuculturuyor. Bu sinirin ustune cikmak yalnizca "raporlanan olcek yaniltici
# olur" demek degil: koordinat donusumunu artik sunucu yapiyor, yani model
# 1568'e indirilmis karedeki pikseli soyler, sunucu kayitli olcegi uygular ve
# aradaki fark (1920 icin 1,22 kat) SESSIZCE koordinata girer. 1568 ustu
# degerlerde `screen_capture` ve `pcb-shot` bunu uyari olarak basiyor;
# o goruntuler bakmak icindir, koordinat cikarmak icin degil.
#
# 1536 olculerek secildi (2026-09-06): 1280'de kucuk yazidaki Turkce
# diakritikler (ğ, ş) bulaniklasip kayboluyor ve kelime tahmin edilerek
# okunuyor; 1536'da dogrudan okunuyor. Bedeli goruntu basina ~540 jeton.
screenshot_scale_long_edge = 1536

# /shot/<token>.png baglantisinin omru (saniye). Bu baglanti OAuth'tan
# BAGIMSIZ: token'i olan herkes goruntuyu gorur, o yuzden paylasmayin.
# Sure icinde kac kez acilirsa acilsin calisir (tek kullanimlik degil, yoksa
# telefonda yenileme/geri tusu goruntuyu yakardi). En az 10.
shot_ttl_seconds = 300

# Diskteki PNG'ler bu kadar saat sonra silinir. Baglantilari coktan olmustur;
# bu yalnizca disk temizligi.
shot_keep_hours = 24

# Imlec goruntuye dahil edilsin mi. Varsayilan true: fareyi bir yere gonderip
# "gercekten oraya gitti mi" diye dogrulamanin tek yolu bu.
include_pointer = true

# Ekran nasil yakalansin:
#   "auto"             ekran yayini varsa o, yoksa gnome-screenshot (varsayilan)
#   "screencast"       yalnizca ekran yayini; kurulamazsa goruntu ALINMAZ
#   "gnome-screenshot" eski yol
#
# NEDEN YAYIN: `gnome-screenshot` her cekimde BEYAZ FLAS patlatiyor ve ses
# cikariyor (flasi kendi ciziyor). XDG portal yolu da ayni. GNOME'un ekran
# goruntusu D-Bus arayuzu ise disaridan cagrilamiyor ("Access denied",
# GNOME 46). Ekran PAYLASIMI yolunda flas yok: sistem bunu fotograf degil
# video sayiyor. OLCULDU 2026-08-03, kayip da yok: yayin ciktisi ile
# gnome-screenshot'in ayni bolgesi %99,8 birebir ayni.
#
# Yayin `desktop_unlock` ile acilir, `desktop_lock` ya da sure dolumuyla
# kapanir. Acikken GNOME ust cubukta bir paylasim gostergesi durur -- bu
# ISTENEN bir sey: ajanin su an masaustune erisebildigi oradan gorunuyor.
# Gosterge cekilen karede de gorunur.
#
# Gerekenler (bu makinede kurulu): python3-gi, gstreamer1.0-pipewire,
# gstreamer1.0-plugins-good. Yoksa kendiliginden gnome-screenshot'a duser.
capture_backend = "auto"

# computer_batch tek cagrida en fazla kac eylem alir. Listeyi bolmek her zaman
# mumkun; bu sinir sonsuz donguye giren bir ajana karsi.
batch_max_actions = 40

# Toplu eylemin sure butcesi (saniye).
#
# Tahmini suresi bu butceyi asan liste HIC BASLAMAZ: tek eylem bile
# gonderilmeden reddedilir. Baslamis bir liste butce dolunca siradaki eyleme
# baslamaz (yarim tiklama olmaz) ve yapilmayan eylemleri listeleyerek doner.
#
# Neden 50: istemcilerin cogu bir arac cagrisini 60 saniyede birakiyor.
# OLCULDU 2026-09-21: dort `wait 30000`lik bir liste 90 saniyelik eski butceyle
# 60 saniye kostu, istemci ise cevabi "did not respond within 60s" diyerek
# birakmisti -- ajan neyin yapildigini hic ogrenemedi. Aradaki 10 saniye son
# `ui_dump`/`screen_capture` ve cevap icin pay. Yalnizca Claude Code gibi uzun
# bekleyen istemciler kullaniliyorsa 105'e kadar cikarilabilir (bir MCP
# cagrisi 110 saniyeyi asamaz).
batch_budget_seconds = 50

# Fare tiklamasindan sonra odagin degisip degismedigi kontrol edilsin mi.
# OLCULDU 2026-08-02: kor bir tiklama odagi baska pencereye kaydiriyor ve
# ardindan gonderilen tuslar oraya gidiyor -- gelistirme sirasinda bir olcum
# tiklamasi masaustune dustu, sonraki `ctrl+a` + `Delete` masaustundeki 23
# ogeyi copa gonderdi. Kontrol acikken batch o noktada durur. Kapatmayin.
batch_check_focus = true

# --- yerel gorsel ajan (computer_task) --------------------------------------
# computer_task gorsel isi MAKINEDEKI bir ajana devreder: ajan `pcb-shot` ile
# ekrani ceker, PNG'yi kendi gozuyle okur, `pcb-do` ile tiklar, tekrar bakar.
#
# GEREKCESI DEGISTI (faz H). Eskiden bu aracin varlik sebebi Spark'in goruntu
# GOREMEMESIYDI. Claude Code ve Codex goruyor (olculdu: bilinen icerikli bir
# PNG'deki gizli deger modelden birebir geri geldi), yani goren bir istemci
# `screen_capture` + `computer_batch` ile isi kendisi yapabilir.
# Bugunku gerekcesi: UZUN SUREN bir GUI isini arka plana atmak, ana ajan
# bloke olmasin diye. Ikinci gerekce hala gecerli: erisilebilirlik agacinin
# BOS geldigi uygulamalar (olculdu 2026-08-02 -> Vesktop'ta ui_dump 0 dugum).

# Hangi ajan surer.
#
# Antigravity'den claude'a GECILDI (faz H, kullanici karari). Iki sebep:
# (1) agy'nin MCP istemcisi yok, proje kapsamindan cikti; (2) F canli
# denemesinde gorevi iki kez tamamlayamadi. `[agents.antigravity]` blogu
# duruyor ve `agent_run` hedefi olarak calisiyor -- yalnizca gorsel surucu
# degisti. Geri almak icin: burayi "antigravity", modeli "gemini-3.6-flash",
# effort'u "high" yapin (uclu birbirine ait, birlikte degistirin).
#
# Bedeli: uzun GUI dongusu artik kullanicinin kendi Claude Code kotasindan
# yiyor (agy'nin kotasi ayriydi).
computer_task_agent = "claude"

# Model + effort. BOS BIRAKILIRSA secilen ajanin kendi varsayilani kullanilir
# -- claude icin `sonnet` + effort `medium`. Gorsel is icin bilincli secim:
# bak-eyle dongusu cok tur suruyor, opus her turda pahali.
#
# ⚠️ BU UCLU BIRBIRINE AIT. Model adi, yukarida secilen ajanin listesinden
# gelmeli. Tutarsizlik ACILISTA yakalanir ve servis baslamaz (eskiden hata
# yalnizca computer_task cagrilinca, yani bir GUI isi tam baslarken cikiyordu).
computer_task_model  = ""
computer_task_effort = ""

# Ajana verilen bak-eyle turu butcesi. DISARIDAN ZORLANAMAZ: prompt'a bir
# butce olarak yaziliyor, arkasinda isin timeout'u ve pcb-do'nun hiz siniri
# duruyor. Arac aciklamasi da bunu garanti diye sunmuyor.
computer_task_max_steps = 25

# pcb-shot'un PNG yazdigi dizin. Bos = $XDG_RUNTIME_DIR/pcbridge/shots
# (mod 700, tmpfs, oturum kapaninca silinir), o da yoksa /tmp/pcb.
# UYGULAMA.md /tmp/pcb diyor; sapma bilincli: /tmp mod 775 yani herkese
# okunur, ekran goruntusu ise bu projenin en gizlilik-hassas ciktisi.
agent_shot_dir = ""

# `shot` VERILMEDEN koordinat gonderildiginde: yakinda kucultulmus bir cekim
# varsa ve koordinat o goruntunun kutusuna dusuyorsa cagriyi REDDET.
#
# Sebep: `shot` unutuldugunda koordinat global sayilir ve eylem sessizce
# yanlis yere duser -- 1280'lik bir goruntuden okunan (640, 360) sag ekrandaki
# bir dugmeyi degil SOL ekranin ortasini gosterir. Belirsizligi coz(e)meyiz
# ((640, 360) gercekten de gecerli bir global koordinat), o yuzden tahmin
# etmek yerine soruyoruz: `shot=` mi `monitor=` mi.
#
# Yanlis pozitif mumkun: gercekten global koordinat veren bir cagri bir tur
# kaybeder ve `monitor=` ile tekrar dener. Sessiz yanlis tiklamadan iyi bir
# takas -- 2026-08-02'de masaustundeki 23 oge tam da boyle gitti.
# Yas olcutu asagidaki `agent_shot_max_age_seconds`ten geliyor.
ambiguous_coord_guard = true

# Ayni hedefe ust uste kacinci tiklamada dizi DURSUN. Ikisi gecer, ucuncusu
# hic gonderilmez.
#
# Sebep: donguye giren bir ajan ayni dugmeye basmayi surduruyor. Hiz siniri
# onu YAVASLATIYOR ama DURDURMUYOR -- dizinin sonuna kadar ayni yere vurmaya
# devam ediyor. Ilk iki tiklama beklenen etkiyi yapmadiysa ucuncusu de
# yapmaz; dogru hamle ekrani `ui_dump` ya da `screen_capture` ile yeniden
# okumak.
#
# "Ayni hedef" = ayni dugum kimligi (`ui_click`) ya da ayni koordinat +
# ayni uzay (`monitor`/`shot`). Araya `move`, `type` gibi bir eylem girerse
# seri kirilir; `wait` KIRMAZ, cunku "tikla-bekle-tikla" tam da o desendir.
#
# `double_click` / `triple_click` tek eylemdir, bu sayaci doldurmaz.
# 0 = kapali. En kucuk gecerli deger 2.
repeat_click_limit = 3

# KOORDINATLI bir pcb-do eylemi gonderilirken en yeni ekran goruntusu en fazla
# bu kadar saniye eski olabilir. 0 = kontrol kapali.
#
# batch_check_focus'tan FARKLI bir tehlikeye bakiyor. O, "tikladiktan SONRA
# odak degisti mi" diyor. Bu ise goruntunun bayatlamasi: goruntuyu aldiktan
# sonra kullanici baska pencereye gecerse odak zaten orada olur, tiklama da
# oraya duser ve DEGISEN bir sey olmadigi icin odak korumasi hic otmez.
#
# OLCULDU 2026-08-03: 69 saniyelik bir goruntuye gore tiklandi; Vesktop
# sanilan yerde Claude uygulamasi vardi, tiklama oraya dustu, hicbir koruma
# calismadi. 2 Agustos'taki kazayla ayni sinif hata -- dogrulanmamis bir
# varsayima gore tiklamak.
agent_shot_max_age_seconds = 60


# ---------------------------------------------------------------------------
# AJANLAR
# {prompt} ve {session_id} sablon olarak degistirilir.
# `command` bir liste; ilk eleman calistirilabilir dosyanin adi.
# `parser` = "claude_stream_json" | "agy_json" | "plain"
# `pty`    = komutu sahte bir terminalde calistir (TTY yoksa ciktisini
#            yutan CLI'lar icin gerekli)
#
# MODEL / EFFORT SECIMI
# Asagidaki alanlarin hepsi opsiyonel. Hicbiri tanimlanmazsa ajan eskisi gibi
# davranir: komuta model/effort bayragi eklenmez, CLI kendi ayarindaki modeli
# kullanir. NEDEN GEREKLI: Claude Code'un modeli ~/.claude/settings.json'dan
# geliyor, yani interaktif oturumda /model ile secim degistirince telefondan
# gelen isler de sessizce o modele geciyor.
#
#   model_args    Model bayraginin sozdizimi, orn. ["--model", "{model}"]
#   effort_args   Effort bayraginin sozdizimi, orn. ["--effort", "{effort}"]
#   models        Serbestce secilebilen modeller
#   restricted_models  Yalnizca kullanici ADINI ACIKCA verdiyse secilebilir.
#                 Varsayilan doldurma buraya asla dusemez.
#   blocked_models     Hicbir kosulda secilemez
#   efforts       Ajanin kabul ettigi effort seviyeleri (genel)
#   model_efforts Model basina izinli effort listesi; `efforts`i ezer.
#                 BOS LISTE = bu model --effort bayragini kabul etmiyor,
#                 bayrak hic eklenmez.
#   default_model      Model belirtilmezse kullanilir
#   default_effort     Effort belirtilmezse (model_effort'tan sonra) kullanilir
#   model_effort  Model basina varsayilan effort
#   effort_required_with_model  Model verilince effort de sart mi
#   aliases       Serbest metin -> kanonik ad. Hem model hem effort icin.
#                 Eslestirme once normalize edilir: kucuk harf, nokta/tire/alt
#                 cizgi ayirac sayilir, harf-rakam siniri bolunur. Yani
#                 "Gemini 3.6 Flash" = "gemini-3.6-flash" = "gemini 3 6 flash"
#                 ve "opus5" = "opus 5". Bu varyantlar icin alias YAZMANIZA
#                 GEREK YOK; alias yalnizca gercekten farkli adlar icin.
# ---------------------------------------------------------------------------

[agents.claude]
enabled = true
description = "Claude Code - Anthropic's terminal coding agent"
command = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json",
  "--verbose",
  "--dangerously-skip-permissions",
]
# Onceki oturumu surdurmek icin komuta EKLENECEK argumanlar
resume_args = ["--resume", "{session_id}"]
parser = "claude_stream_json"
pty = false

model_args  = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]
# Varsayilan Sonnet 5 + medium: telefondan atilan "su klasorde ne var" tarzi
# isler Opus 5 + xhigh ile calisip bosuna kota yakmasin diye.
default_model = "sonnet"
models  = ["sonnet", "opus", "haiku"]
# Fable 5 Pro planinda EK KULLANIM KREDISI istiyor. "best" takma adi da
# Fable'a cozuluyor, o yuzden ikisi de kapali.
blocked_models = ["fable", "best"]
efforts = ["low", "medium", "high", "xhigh", "max"]
# Claude Code model tek basina verilince kendi varsayilan effort'unu kullanir,
# hata vermez -> zorunlu degil.
effort_required_with_model = false

[agents.claude.model_effort]
sonnet = "medium"
opus   = "high"
haiku  = "medium"

[agents.claude.aliases]
"sonnet 5"  = "sonnet"
"opus 5"    = "opus"
"haiku 4.5" = "haiku"
# Engelli modelin varyantlari da ayni yere gitsin ki "bilinmeyen model" yerine
# "engelli" gerekcesiyle reddedilsin.
"fable 5"   = "fable"
"dusuk"      = "low"
"orta"       = "medium"
"yuksek"     = "high"
"extra"      = "xhigh"
"ekstra"     = "xhigh"
"cok yuksek" = "xhigh"
"maksimum"   = "max"
"en yuksek"  = "max"

[agents.antigravity]
# Antigravity CLI'in calistirilabilir adi `agy` (paket adi antigravity-cli).
#
# pty = false: agy 1.1.9'da upstream #76 (TTY olmadan bos cikti) DUZELMIS.
# Olculdu -> `-p` ciktisi boruya/dosyaya sorunsuz yaziliyor, `script`
# sarmalayicisina gerek yok.
#
# --output-format json: agy yapisal cikti veriyor (conversation_id, status,
# response, usage). Duz metinden UUID regex'i ile kimlik avlamaktan cok daha
# saglam; `parser = "agy_json"` bunu okur.
enabled = true
description = "Antigravity CLI (agy) - Google's terminal coding agent"
#
# --print-timeout: agy'nin print modundaki varsayilani 5 DAKIKA ve doldugunda
# yaptigi isi atip `status: ERROR, error: timeout waiting for response`
# donuyor. OLCULDU 2026-08-03: bir computer_task GUI gorevi 239 saniyede bu
# duvara tosladi -- ajan ekrani okuyup tikliyordu, hicbir seyi yanlis
# yapmiyordu, yalnizca GUI isi yavas. 30 dakika `default_job_timeout` ile ayni;
# gercek ust sinir orasi kalsin.
command = [
  "agy", "-p", "{prompt}",
  "--dangerously-skip-permissions",
  "--output-format", "json",
  "--print-timeout", "30m",
]
# Onceki konusmaya donmek icin; kimlik JSON ciktisindaki conversation_id.
resume_args = ["--conversation", "{session_id}"]
parser = "agy_json"
pty = false

model_args  = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]
# agy'de effort model kimliginin PARCASI: `--model X --effort Y` = `X-Y`.
# Gemini modellerinde effort'suz cagri exit 1 verir -> zorunlu.
effort_required_with_model = true
default_model  = "gemini-3.8-flash"
default_effort = "high"
efforts = ["low", "medium", "high"]
models  = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.1-pro"]
# Yalnizca ACIKCA istenirse; varsayilan secimde asla kullanilmaz.
# Kimlikler `agy models` ciktisindan birebir alindi -- nokta degil TIRE.
restricted_models = [
  "claude-sonnet-4-6",
  "claude-opus-4-6-thinking",
  "gpt-oss-120b-medium",
]

# Model basina izinli effort. `agy models` ciktisindan turetildi:
# gemini-3.1-pro'da MEDIUM YOK, Claude/GPT-OSS modelleri --effort KABUL ETMIYOR
# (verilirse "Error: invalid model selection" + exit 1).
[agents.antigravity.model_efforts]
"gemini-3.8-flash"         = ["low", "medium", "high"]
"gemini-3.7-flash"         = ["low", "medium", "high"]
"gemini-3.6-flash"         = ["low", "medium", "high"]
"gemini-3.1-pro"           = ["low", "high"]
"claude-sonnet-4-6"        = []
"claude-opus-4-6-thinking" = []
"gpt-oss-120b-medium"      = []

[agents.antigravity.model_effort]
"gemini-3.8-flash" = "high"
"gemini-3.7-flash" = "high"
"gemini-3.6-flash" = "high"
"gemini-3.1-pro"   = "high"

[agents.antigravity.aliases]
"3.6 flash"         = "gemini-3.6-flash"
"flash"             = "gemini-3.6-flash"
"3.5 flash"         = "gemini-3.5-flash"
"3.1 pro"           = "gemini-3.1-pro"
"pro"               = "gemini-3.1-pro"
"gemini pro"        = "gemini-3.1-pro"
"claude sonnet 4.6" = "claude-sonnet-4-6"
"claude opus 4.6"   = "claude-opus-4-6-thinking"
"gpt"               = "gpt-oss-120b-medium"
"gpt oss"           = "gpt-oss-120b-medium"
"gpt oss 120b"      = "gpt-oss-120b-medium"
"dusuk"  = "low"
"orta"   = "medium"
"yuksek" = "high"

# Istersen baska ajanlar da ekleyebilirsin, ornek:
# [agents.codex]
# enabled = true
# description = "OpenAI Codex CLI"
# command = ["codex", "exec", "{prompt}"]
# resume_args = []
# parser = "plain"
# pty = false
