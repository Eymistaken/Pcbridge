[workspace]
members = [
    "crates/pcbridge-core",
    "crates/pcbridge-native",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
async-io = "2.6"
futures-lite = "2.6"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = "5.13"
