# On a v* tag: build every artifact and open a DRAFT release. Publishing it
# stays a human decision.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: native-helper
          path: pcbridge/_native/

      - name: Wheel and sdist (the wheel carries the native helper)
        run: |
          chmod +x pcbridge/_native/*/pcbridge-native
          python -m pip install build
          python -m build --outdir dist

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: dist/

      # The install script is served from the release (`.../releases/latest/
      # download/install.sh`) and reads constraints.txt and sha256sums.txt
      # from it, so both are release assets too.
      - name: Install script and dependency constraints
        run: |
          cp install.sh dist/install.sh
          cp packaging/constraints.txt dist/constraints.txt

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # The install commands open every release body, above the generated
      # notes. When the draft's notes are replaced by the written ones, keep
      # this block at the top: it is the only place on the release page that
      # says how to install.
      - name: Install block for the release notes
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-install.md \
            > "$RUNNER_TEMP/release-install.md"
          cat "$RUNNER_TEMP/release-install.md"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: pcbridge ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-install.md
          generate_release_notes: true
