# Build, test and package pcbridge-native on Debian 12, the base the release
# helper is built on (package.yml), then smoke-test that binary on Ubuntu
# 24.04 with only the runtime library installed.
#
# Live capture and input tests never run here: they need a desktop session and
# an explicit opt-in (PCBRIDGE_TEST_CAPTURE / PCBRIDGE_TEST_INPUT), and CI has
# neither. See docs/native/packaging.md.
name: native

on:
  push:
    paths:
      - "rust/**"
      - "scripts/build-native.sh"
      - "pcbridge/native/**"
      - "tests/integration/test_native_packaging.py"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/build-native.sh"
      - "pcbridge/native/**"
      - "tests/integration/test_native_packaging.py"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    container: debian:12
    env:
      PCBRIDGE_MAX_GLIBC: "2.35"
    steps:
      - name: Build dependencies (not needed at runtime)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 build-essential \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev pkg-config

      - uses: actions/checkout@v7

      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # git refuses a repository another user owns, and in a container
          # the checkout may belong to the runner's user, not root: the
          # build id would then be "unknown".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # rust/rust-toolchain.toml pins 1.95.0 with clippy and rustfmt. It is
      # selected by working directory, so every cargo step runs inside rust/.
      - name: Toolchain
        working-directory: rust
        run: rustup toolchain install && cargo --version

      - name: Format
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked \
            --features pcbridge-native/test-harness -- -D warnings

      - name: Tests
        working-directory: rust
        # The runner has no desktop session, so the backend would detect
        # nothing; name the desktop the production-mode test describes, as
        # the Python fixtures do (tests/integration/__init__.py).
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          cargo test --workspace --locked --no-fail-fast
          cargo test --workspace --locked --no-fail-fast \
            --features pcbridge-native/test-harness

      - name: Package release helper
        run: scripts/build-native.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pcbridge-native-x86_64-unknown-linux-gnu
          path: pcbridge/_native/x86_64-unknown-linux-gnu/
          if-no-files-found: error

  # The helper built above, on the system most installs run, with nothing
  # but its runtime library: it must start where it was not built.
  packaging-smoke:
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pcbridge-native-x86_64-unknown-linux-gnu
          path: pcbridge/_native/x86_64-unknown-linux-gnu/

      - name: Runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Packaging smoke test
        run: |
          chmod +x pcbridge/_native/*/pcbridge-native   # artifacts drop the mode
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          PCBRIDGE_TEST_REQUIRE_RELEASE=1 \
            .venv/bin/python -m unittest tests/integration/test_native_packaging.py -v
